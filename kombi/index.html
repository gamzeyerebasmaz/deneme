<!doctype html>
<html><head><meta charset="utf-8">
<style>

</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,cv=document.getElementById('c'),c=cv.getContext('2d');
const INK='#2B4A40',ORANGE='#E0834F',TXT='46,42,53';
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),seg=(t,a,b)=>clamp((t-a)/(b-a),0,1),ss=x=>x*x*(3-2*x),eo=x=>1-Math.pow(1-x,3),lerp=(a,b,t)=>a+(b-a)*t;
const back=(x,s=1.7)=>{x=clamp(x,0,1);const y=x-1;return 1+y*y*((s+1)*y+s)};
const rnd=i=>{const r=Math.sin(i*127.1+311.7)*43758.5453;return r-Math.floor(r)};
let TL=null,CU=[],DUR=100,END=97,T={};
const C=i=>CU[i].at,E=i=>CU[i].end,Wd=(i,j)=>CU[i].words[j];
const logo=new Image();logo.src='assets/logo.png';

// ---------------- timing (all from the voice timeline) ----------------
function setup(){
 CU=TL.cues;END=E(CU.length-1)+0.5;DUR=END+3;window.DUR=DUR;
 const S=[0,2,4,6,9,12,15,18,21,25,26,29];
 T.sc=S.map((ci,k)=>k===0?0:C(ci)-0.2);T.sc.push(END);
 T.yanlis=Wd(1,1);T.b1=Wd(2,0)+0.2;T.b2=Wd(3,4);T.bar=Wd(5,1);
 T.kaynar=Wd(7,0);T.ilik=Wd(7,2);T.fark=Wd(8,1);
 T.cold=C(15);T.coin=Wd(17,2);T.clock=Wd(19,0);T.gas=Wd(20,2);T.p31=Wd(20,1);
 T.dial=Wd(23,1);T.sun=Wd(24,4);T.k1=Wd(25,1);T.k2=Wd(25,2);T.k3=Wd(25,4);T.heart=Wd(25,6);
 T.m1=C(26);T.m2=C(27);T.m3=C(28);T.tag=Wd(30,1);T.send=Wd(30,6);T.dev=C(31);T.com=C(32);T.follow=Wd(32,3);
 // sound events for the mix
 const ev=[];const P=(t,type='pop')=>ev.push({t:+t.toFixed(3),type});
 P(T.yanlis,'stamp');P(T.b1);P(T.b2);P(T.bar,'whoosh');P(T.kaynar);P(T.ilik);P(T.fark,'whoosh');
 P(T.coin,'coin');P(T.clock,'tick');P(T.gas,'whoosh');P(T.p31,'pop');P(T.dial,'click');P(T.sun,'ding');
 P(T.k1);P(T.k2);P(T.k3);P(T.heart,'ding');P(T.m1,'click');P(T.m2,'click');P(T.m3,'ding');
 P(T.tag);P(T.send,'whoosh');P(T.dev);P(T.dev+0.25);P(T.dev+0.5);P(T.com);P(T.follow,'click');P(END+0.2,'ding');
 for(let k=1;k<T.sc.length-1;k++)P(T.sc[k],'swish');
 window.EV=ev.sort((a,b)=>a.t-b.t);
}
fetch('timeline.json').then(r=>r.json()).then(j=>{TL=j;setup();
 return Promise.all([document.fonts.load('900 80px NU','ağışİüöç₺'),new Promise(r=>{logo.complete?r():(logo.onload=r,logo.onerror=r)})]);}).then(()=>{window.READY=true});

// ---------------- background ----------------
function bg(night=0){
 const g=c.createLinearGradient(0,0,0,H);
 g.addColorStop(0,night?'#ECE6F6':'#FDF1EA');g.addColorStop(1,night?'#F3DCDA':'#F4DDD3');c.fillStyle=g;c.fillRect(0,0,W,H);
 const r=c.createRadialGradient(W/2,H*0.55,80,W/2,H*0.55,1100);r.addColorStop(0,'rgba(255,250,244,0.8)');r.addColorStop(1,'rgba(255,250,244,0)');c.fillStyle=r;c.fillRect(0,0,W,H);
 const v=c.createRadialGradient(W/2,H/2,600,W/2,H/2,1250);v.addColorStop(0,'rgba(196,150,140,0)');v.addColorStop(1,'rgba(196,150,140,0.25)');c.fillStyle=v;c.fillRect(0,0,W,H);
}
function rr(x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);}
function st(w=7){c.strokeStyle=INK;c.lineWidth=w;c.lineJoin='round';c.lineCap='round';}
function txt(s,x,y,size,col=INK,align='center'){c.font=`900 ${size}px NU`;c.fillStyle=col;c.textAlign=align;c.textBaseline='middle';c.fillText(s,x,y);}
function pop(k){return back(clamp(k,0,1));}
function chip(x,y,label,k,fill='#FFFDF8',col=INK,size=44,rot=0){ if(k<=0)return;c.save();c.translate(x,y);c.rotate(rot);c.scale(pop(k),pop(k));
 c.font=`900 ${size}px NU`;const w=c.measureText(label).width+size*1.1,h=size*1.7;st(6);c.fillStyle=fill;rr(-w/2,-h/2,w,h,h/2);c.fill();c.stroke();txt(label,0,2,size,col);c.restore();}
function bubble(x,y,label,k,tail=1){ if(k<=0)return;c.save();c.translate(x,y);c.scale(pop(k),pop(k));c.font='900 46px NU';
 const w=c.measureText(label).width+70,h=96;st(6);c.fillStyle='#FFFDF8';rr(-w/2,-h/2,w,h,30);c.fill();c.stroke();
 c.beginPath();c.moveTo(tail*30,h/2-4);c.lineTo(tail*60,h/2+38);c.lineTo(tail*70,h/2-4);c.fill();c.stroke();c.fillStyle='#FFFDF8';c.fillRect(tail*30+(tail>0?3:-43),h/2-10,40,10);
 txt(label,0,2,46);c.restore();}

// ---------------- characters ----------------
const BL=[1.3,4.4,7.9,11.2,14.6,18.3,22.1,25.7,29.4,33.0,36.8,40.5,44.1,47.7,51.6,55.2,58.9,62.4,66.1,69.8,73.4,77.0,80.9,84.3,88.0,91.6,95.2,98.7];
function blink(t,o=0){for(const p of BL){const d=t-p-o;if(d>=0&&d<0.16)return Math.sin(d/0.16*Math.PI);}return 0;}
function baby(t,o){
 const {x,y,s=1,mouth='o',look=0,lookY=0,lid=0,sleep=0,smile=1,body=true}=o;
 c.save();c.translate(x,y);c.scale(s,s);st();
 if(body){c.fillStyle='#CDEBDC';c.beginPath();c.moveTo(-330,900);c.lineTo(-310,420);c.bezierCurveTo(-300,280,-200,200,0,200);c.bezierCurveTo(200,200,300,280,310,420);c.lineTo(330,900);c.closePath();c.fill();c.stroke();
  c.fillStyle='#EAF6EF';c.beginPath();c.moveTo(-95,205);c.quadraticCurveTo(0,290,95,205);c.closePath();c.fill();c.stroke();c.fillStyle=ORANGE;c.beginPath();c.arc(0,330,16,0,7);c.fill();}
 const skin='#F6D3BC';c.fillStyle=skin;
 for(const sx of[-1,1]){c.beginPath();c.ellipse(sx*212,25,40,48,0,0,7);c.fill();c.stroke();}
 c.beginPath();c.ellipse(0,0,220,205,0,0,7);c.fill();c.stroke();
 c.lineWidth=12;c.strokeStyle='#C98A64';c.beginPath();c.moveTo(-22,-198);c.bezierCurveTo(-40,-250,10,-275,30,-245);c.bezierCurveTo(45,-222,15,-205,2,-222);c.stroke();
 c.lineWidth=9;c.beginPath();c.moveTo(-70,-190);c.quadraticCurveTo(-80,-215,-60,-228);c.stroke();c.beginPath();c.moveTo(65,-192);c.quadraticCurveTo(80,-212,70,-226);c.stroke();
 c.fillStyle='rgba(244,160,152,0.55)';for(const sx of[-1,1]){c.beginPath();c.ellipse(sx*128,72,44,28,0,0,7);c.fill();}
 st();
 if(sleep){for(const sx of[-1,1]){c.beginPath();c.arc(sx*76,4,26,0.15*Math.PI,0.85*Math.PI);c.stroke();}}
 else{const L=clamp(Math.max(lid,blink(t)),0,1);
  for(const sx of[-1,1]){const ex=sx*76,ey=8,px=ex+look*13,py=ey+lookY*8;c.save();c.beginPath();c.ellipse(ex,ey,33,37,0,0,7);c.clip();
   c.fillStyle=INK;c.beginPath();c.ellipse(px,py,33,37,0,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(px+11,py-13,11,0,7);c.fill();c.beginPath();c.arc(px-10,py+12,5,0,7);c.fill();
   if(L>0){c.fillStyle=skin;c.fillRect(ex-40,ey-40,80,80*L);st(6);c.beginPath();c.moveTo(ex-36,ey-38+80*L);c.lineTo(ex+36,ey-38+80*L);c.stroke();}c.restore();
   c.strokeStyle='#B97E5C';c.lineWidth=7;c.beginPath();c.moveTo(ex-28,-46);c.quadraticCurveTo(ex,-58,ex+28,-46);c.stroke();}}
 st();const my=100;
 if(mouth==='o'){c.fillStyle='#B4505A';c.beginPath();c.ellipse(0,my,15,19,0,0,7);c.fill();c.stroke();}
 else if(mouth==='smile'){const k=lerp(14,30,smile);c.beginPath();c.moveTo(-32,my-4);c.quadraticCurveTo(0,my-4+k*1.5,32,my-4);c.stroke();}
 else{c.beginPath();c.moveTo(-22,my+4);c.quadraticCurveTo(0,my-2,22,my+4);c.stroke();}
 c.restore();}
function dad(t,o){
 const {x,y,s=1,mouth='smile',look=0,talk=0,tilt=0}=o;
 c.save();c.translate(x,y);c.scale(s,s);c.rotate(tilt);st();
 c.fillStyle='#D9D0F0';c.beginPath();c.moveTo(-360,900);c.lineTo(-330,430);c.bezierCurveTo(-310,290,-200,215,0,215);c.bezierCurveTo(200,215,310,290,330,430);c.lineTo(360,900);c.closePath();c.fill();c.stroke();
 c.fillStyle='#FFFDF8';c.beginPath();c.moveTo(-80,222);c.lineTo(0,330);c.lineTo(80,222);c.closePath();c.fill();c.stroke();
 c.strokeStyle='#C4B8E6';c.lineWidth=5;for(const yy of[520,620,720]){c.beginPath();c.moveTo(-300,yy);c.lineTo(300,yy);c.stroke();}st();
 const skin='#F1C7A8';c.fillStyle=skin;for(const sx of[-1,1]){c.beginPath();c.ellipse(sx*186,20,36,46,0,0,7);c.fill();c.stroke();}
 c.beginPath();c.ellipse(0,0,188,205,0,0,7);c.fill();c.stroke();
 // hair
 c.fillStyle='#5C4033';c.beginPath();c.moveTo(-186,-30);c.quadraticCurveTo(-205,-215,0,-222);c.quadraticCurveTo(205,-215,186,-30);c.quadraticCurveTo(170,-120,90,-130);c.quadraticCurveTo(20,-160,-60,-125);c.quadraticCurveTo(-150,-115,-186,-30);c.closePath();c.fill();c.stroke();
 // beard
 c.fillStyle='#6E4E3D';c.beginPath();c.moveTo(-182,30);c.quadraticCurveTo(-170,212,0,222);c.quadraticCurveTo(170,212,182,30);c.quadraticCurveTo(160,120,70,92);c.quadraticCurveTo(0,72,-70,92);c.quadraticCurveTo(-160,120,-182,30);c.closePath();c.fill();c.stroke();
 // mouth
 const op=talk?0.5+0.5*Math.abs(Math.sin(t*14)):0;
 c.fillStyle='#9B4F4F';c.beginPath();if(mouth==='smile'){c.moveTo(-42,128);c.quadraticCurveTo(0,175+op*14,42,128);c.quadraticCurveTo(0,140,-42,128);}else{c.ellipse(0,140,22,16+op*8,0,0,7);}c.closePath();c.fill();st(6);c.stroke();
 // eyes & glasses
 const bl=blink(t,0.4);
 for(const sx of[-1,1]){const ex=sx*68;c.fillStyle='rgba(255,255,255,0.35)';c.beginPath();c.arc(ex,0,50,0,7);c.fill();
  if(bl>0.5){st(6);c.beginPath();c.moveTo(ex-14,2);c.lineTo(ex+14,2);c.stroke();}else{c.fillStyle=INK;c.beginPath();c.arc(ex+look*10,2,14,0,7);c.fill();}
  st(7);c.beginPath();c.arc(ex,0,50,0,7);c.stroke();
  c.strokeStyle='#5C4033';c.lineWidth=12;c.beginPath();c.moveTo(ex-30,-70);c.quadraticCurveTo(ex,-80,ex+30,-70);c.stroke();}
 st(7);c.beginPath();c.moveTo(-18,-4);c.quadraticCurveTo(0,-14,18,-4);c.stroke();
 c.fillStyle='rgba(232,150,140,0.45)';for(const sx of[-1,1]){c.beginPath();c.ellipse(sx*130,62,30,18,0,0,7);c.fill();}
 c.restore();}
function grandma(x,y,s){c.save();c.translate(x,y);c.scale(s,s);st();
 c.fillStyle='#E6E2EE';c.beginPath();c.arc(0,-205,70,0,7);c.fill();c.stroke();
 c.fillStyle='#F3D2BC';c.beginPath();c.ellipse(0,0,180,195,0,0,7);c.fill();c.stroke();
 c.fillStyle='#E6E2EE';c.beginPath();c.moveTo(-180,-10);c.quadraticCurveTo(-190,-190,0,-198);c.quadraticCurveTo(190,-190,180,-10);c.quadraticCurveTo(120,-120,0,-110);c.quadraticCurveTo(-120,-120,-180,-10);c.closePath();c.fill();c.stroke();
 for(const sx of[-1,1]){c.fillStyle=INK;c.beginPath();c.arc(sx*62,10,12,0,7);c.fill();st(6);c.beginPath();c.arc(sx*62,10,42,0,7);c.stroke();}
 c.beginPath();c.moveTo(-20,8);c.lineTo(20,8);c.stroke();c.beginPath();c.moveTo(-40,105);c.quadraticCurveTo(0,140,40,105);c.stroke();
 c.fillStyle='rgba(244,160,152,0.55)';for(const sx of[-1,1]){c.beginPath();c.ellipse(sx*120,70,30,18,0,0,7);c.fill();}c.restore();}
function sick(x,y,s){c.save();c.translate(x,y);c.scale(s,s);st();
 c.fillStyle='#E3EEDC';c.beginPath();c.ellipse(0,0,180,195,0,0,7);c.fill();c.stroke();
 c.fillStyle='#8FB7C9';rr(-150,-200,300,90,40);c.fill();c.stroke();
 for(const sx of[-1,1]){st(6);c.beginPath();c.arc(sx*62,20,24,1.1*Math.PI,1.9*Math.PI);c.stroke();}
 c.beginPath();c.moveTo(-30,110);c.quadraticCurveTo(0,96,30,110);c.stroke();
 c.save();c.translate(40,105);c.rotate(-0.35);c.fillStyle='#FFFDF8';rr(0,-12,150,24,12);c.fill();c.stroke();c.fillStyle='#E46F5E';rr(110,-8,36,16,8);c.fill();c.restore();
 c.fillStyle='#BFE3F5';c.beginPath();c.moveTo(-150,-60);c.quadraticCurveTo(-170,-20,-150,-10);c.quadraticCurveTo(-130,-20,-150,-60);c.fill();c.stroke();c.restore();}
function kombi(t,o){const {x,y,s=1,temp='22°',mood='happy',sweat=0,flame=1,look=0,pipe=330}=o;
 c.save();c.translate(x,y);c.scale(s,s);
 for(const px of[-90,-30,30,90]){c.strokeStyle=INK;c.lineWidth=24;c.beginPath();c.moveTo(px,170);c.lineTo(px,170+pipe);c.stroke();c.strokeStyle='#E7B793';c.lineWidth=12;c.beginPath();c.moveTo(px,170);c.lineTo(px,170+pipe);c.stroke();}
 st();c.fillStyle='#FFF8EE';rr(-160,-220,320,400,30);c.fill();c.stroke();c.beginPath();c.moveTo(-160,110);c.lineTo(160,110);c.stroke();
 c.fillStyle='#CDEBDC';for(const kx of[-50,50]){c.beginPath();c.arc(kx,145,16,0,7);c.fill();c.stroke();}
 // face
 for(const sx of[-1,1]){const ex=sx*55;c.fillStyle='#fff';c.beginPath();c.ellipse(ex,-140,28,32,0,0,7);c.fill();c.stroke();
  const b=blink(t,0.8);if(b>0.5){c.beginPath();c.moveTo(ex-18,-140);c.lineTo(ex+18,-140);c.stroke();}else{c.fillStyle=INK;c.beginPath();c.arc(ex+look*10,-136,13,0,7);c.fill();}}
 st(6);if(mood==='happy'){c.beginPath();c.moveTo(-28,-90);c.quadraticCurveTo(0,-68,28,-90);c.stroke();}else{c.beginPath();c.moveTo(-26,-78);c.quadraticCurveTo(0,-96,26,-78);c.stroke();}
 if(mood==='tired'){c.beginPath();c.moveTo(-85,-182);c.lineTo(-30,-170);c.moveTo(85,-182);c.lineTo(30,-170);c.stroke();}
 // screen
 c.fillStyle='#33463F';rr(-110,-40,220,110,18);c.fill();st(6);c.stroke();
 const fl=flame*(0.85+0.15*Math.sin(t*12));c.save();c.translate(-62,16);c.scale(fl,fl);c.fillStyle=ORANGE;c.beginPath();c.moveTo(0,-30);c.quadraticCurveTo(28,0,16,20);c.quadraticCurveTo(0,32,-16,20);c.quadraticCurveTo(-26,0,0,-30);c.fill();c.restore();
 txt(temp,26,16,62,'#BDEBD3');
 if(sweat>0){const d=(t*0.9)%1;c.globalAlpha=sweat*(1-d);c.fillStyle='#A9D8F2';st(5);c.beginPath();c.moveTo(150,-200+d*80);c.quadraticCurveTo(170,-160+d*80,150,-150+d*80);c.quadraticCurveTo(130,-160+d*80,150,-200+d*80);c.fill();c.stroke();c.globalAlpha=1;}
 c.restore();}
function meter(x,y,s,val,hl=0){c.save();c.translate(x,y);c.scale(s,s);st();
 for(const px of[-80,80]){c.strokeStyle=INK;c.lineWidth=26;c.beginPath();c.moveTo(px,-130);c.lineTo(px,-330);c.stroke();c.strokeStyle='#C9D4DB';c.lineWidth=14;c.beginPath();c.moveTo(px,-130);c.lineTo(px,-330);c.stroke();}
 st();c.fillStyle='#DDE6EC';rr(-200,-140,400,280,30);c.fill();c.stroke();txt('GAZ SAYACI',0,-90,32);
 c.fillStyle='#2E2A35';rr(-160,-40,320,96,14);c.fill();c.stroke();
 const sv=val.split(',');c.font='900 60px NU';c.textAlign='center';c.textBaseline='middle';
 c.fillStyle='#F6F1EA';c.fillText(sv[0],-30,10);c.fillStyle=ORANGE;rr(80,-24,62,68,8);c.fill();c.fillStyle='#fff';c.fillText(sv[1],111,10);
 if(hl>0){c.globalAlpha=hl*0.5;c.strokeStyle='#F7D27A';c.lineWidth=14;rr(-172,-52,344,120,20);c.stroke();c.globalAlpha=1;}
 c.restore();}

// ---------------- props ----------------
function sparkle(x,y,s,a=1){c.save();c.translate(x,y);c.scale(s,s);c.globalAlpha=a;c.fillStyle='#F7D27A';st(4);c.beginPath();for(let i=0;i<8;i++){const r=i%2?10:34,an=i*Math.PI/4-Math.PI/2;c.lineTo(Math.cos(an)*r,Math.sin(an)*r);}c.closePath();c.fill();c.stroke();c.restore();}
function heart(x,y,s,a=1){c.save();c.translate(x,y);c.scale(s,s);c.globalAlpha=a;c.fillStyle='#F28C93';st(4);c.beginPath();c.moveTo(0,12);c.bezierCurveTo(-30,-10,-14,-34,0,-18);c.bezierCurveTo(14,-34,30,-10,0,12);c.fill();c.stroke();c.restore();}
function moon(x,y,s){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle='#F7E6A8';st(5);c.beginPath();c.arc(0,0,40,0.6,2*Math.PI-0.6);c.arc(22,-6,32,2*Math.PI-1.05,1.05,true);c.closePath();c.fill();c.stroke();c.restore();}
function sun(x,y,s){c.save();c.translate(x,y);c.scale(s,s);st(5);c.fillStyle='#F7C873';for(let i=0;i<8;i++){c.save();c.rotate(i*Math.PI/4);c.beginPath();c.moveTo(0,-52);c.lineTo(0,-70);c.stroke();c.restore();}c.beginPath();c.arc(0,0,38,0,7);c.fill();c.stroke();c.restore();}
function arrowsOut(t,list,n,speed,amt){ // list of [x,y,dx,dy]
 for(let i=0;i<n;i++){const b=list[i%list.length],j=rnd(i)*0.9,ph=((t*speed+rnd(i+50))%1);const a=Math.sin(ph*Math.PI)*amt;if(a<=0.02)continue;
  const ox=b[0]+(b[3]?(j-0.45)*b[4]:0),oy=b[1]+(b[2]?(j-0.45)*b[4]:0),px=ox+b[2]*ph*130,py=oy+b[3]*ph*130;
  c.save();c.translate(px,py);c.rotate(Math.atan2(b[3],b[2]));c.globalAlpha=a;c.fillStyle=ORANGE;c.beginPath();c.moveTo(22,0);c.lineTo(-12,-15);c.lineTo(-12,15);c.closePath();c.fill();c.restore();}}
function house(t,o){const {x,y,s=1,warm=1,arrows=0,speed=0.7,night=1,inner=null,sunk=0,label=null}=o;
 c.save();c.translate(x,y);c.scale(s,s);
 const ar=[[-330,-210,-1,0,300],[330,-210,1,0,300],[-190,-470,-0.55,-0.85,260],[190,-470,0.55,-0.85,260],[-200,-260,-1,0,90],[0,-560,0,-1,120]];
 if(arrows>0)arrowsOut(t,ar,Math.round(10+arrows*26),speed,Math.min(1,arrows*1.4));
